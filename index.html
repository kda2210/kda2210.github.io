:root{
  --void: #120417;
  --plum: #54005c;

*{ margin:0; padding:0; box-sizing:border-box; }

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  position:relative;
  overflow:hidden;
}

.spotlight{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background: radial-gradient(600px circle at var(--mx) var(--my), rgba(193,126,214,.38), transparent 60%);
  mix-blend-mode: screen;
}

.container{ position:relative; z-index:1; width:100%; max-width:380px; text-align:center; }

.hero, .actions{ opacity:0; transform:translateY(16px); }
@media (prefers-reduced-motion:no-preference){
  .hero, .actions{ transition: opacity .7s ease, transform .7s ease; }
  .actions{ transition-delay:.15s; }
}
.loaded .hero, .loaded .actions{ opacity:1; transform:translateY(0); }

.avatar-wrap{
  position:relative;
  width:112px; height:112px;
  margin:0 auto 24px;
  transition: transform .15s ease-out;
  will-change: transform;
  cursor:pointer;
}
.avatar-wrap::before{
  content:'';
  position:absolute;
  inset:-16px;
  border-radius:50%;
  background:conic-gradient(from 0deg, var(--plum), var(--plum-light), var(--plum));
  filter:blur(20px);
  opacity:.6;
}
@media (prefers-reduced-motion:no-preference){
  .avatar-wrap::before{ animation: spin 9s linear infinite; }
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.avatar{
  position:relative; z-index:1; display:block;
  width:112px; height:112px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--void);
  background:#2a2a2a;
}
.avatar-error{
  background: linear-gradient(135deg, var(--plum) 0%, #764ba2 100%);
  display:flex; align-items:center; justify-content:center;
  font-size:40px; color:#fff;
}

.spark{
  position:absolute;
  top:50%; left:50%;
  width:6px; height:6px;
  margin:-3px 0 0 -3px;
  border-radius:50%;
  background:var(--plum-light);
  pointer-events:none;
  z-index:2;
  animation: spark-burst .9s ease-out forwards;
}
@keyframes spark-burst{
  to{ transform: translate(var(--dx), var(--dy)) scale(0); opacity:0; }
}

.hero-title, .hero-sub, #divider-text, .btn-text{ transition: opacity .18s ease; }

.hero-title{
  font-family:'Fraunces', Georgia, serif;
  font-style:italic;
  font-weight:500;
  font-size:26px;
  line-height:1.3;
  margin-bottom:8px;
  color:var(--mist);
}
@media (prefers-reduced-motion:no-preference){

    background: linear-gradient(100deg, var(--mist) 40%, var(--plum-light) 50%, var(--mist) 60%);

.hero-sub{ font-size:15px; line-height:1.5; color:var(--mist-dim); margin-bottom:30px; }

.clock-corner{
  position:fixed;

@media (prefers-reduced-motion:no-preference){ .clock-corner{ transition:opacity .5s ease .2s; } }
.clock-corner.show{ opacity:1; }

.vcard-fab{
  position:fixed;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));

}
.vcard-fab svg{ width:18px; height:18px; fill:currentColor; flex-shrink:0; }
.vcard-fab:hover{ filter:brightness(1.15); }
.vcard-fab:active{ transform:scale(.96); }
.vcard-fab:focus-visible{ outline:2px solid var(--mist); outline-offset:3px; }
@media (prefers-reduced-motion:no-preference){
  .vcard-fab{ transition: opacity .5s ease .3s, transform .5s ease .3s, filter .2s ease, box-shadow .25s ease; }

.vcard-fab.show{ opacity:1; transform:translateY(0) scale(1); }

.link-btn{
  position:relative;

  display:flex; align-items:center; justify-content:center; gap:12px;

.link-btn:active{ transform:scale(.98); }

.ripple{

@keyframes ripple-anim{ to{ transform:scale(2.4); opacity:0; } }
@media (prefers-reduced-motion:reduce){

.divider{ display:flex; align-items:center; gap:14px; color:var(--mist-dim); font-size:13px; margin:20px 0; }
.divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line); }

.lang-switch{ margin-top:28px; display:inline-flex; gap:2px; padding:3px; border:1px solid var(--line); border-radius:999px; }
.lang-btn{ background:transparent; border:0; color:var(--mist-dim); padding:6px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600; transition:.2s; }
.lang-btn.active{ background:var(--plum); color:#fff; }
.lang-btn:hover{ color:var(--mist); }
.lang-btn:focus-visible{ outline:2px solid var(--mist); outline-offset:2px; }

.toast{
  position:fixed; left:50%; bottom:28px; z-index:5;
  transform:translate(-50%, 12px);
  background:var(--plum); color:#fff;
  padding:10px 18px; border-radius:999px;

}
.toast.show{ opacity:1; transform:translate(-50%,0); }

@media (max-width:480px){
  .link-btn{ padding:12px 16px; font-size:14.5px; }
  .hero-title{ font-size:23px; }
}
</style>

<script>
(function() {
  const translations = {
    ru: { title:'Важно, что внутри.', sub:'Выбирай удобный способ связи.', divider:'или',
          tg:"Написать в Telegram", email:"Написать на почту", vk:"Написать ВКонтакте", phone:"Позвонить",
          vcard:"Сохранить контакт", copied:"Скопировано", secret:"Нашёл(а) секрет ✨" },
    en: { title:'What matters is what\u2019s inside.', sub:'Choose a convenient way to get in touch.', divider:'or',
          tg:"Write in Telegram", email:"Write an email", vk:"Write in VK", phone:"Call",
          vcard:"Save contact", copied:"Copied", secret:"Found a secret ✨" }
  };

  const htmlRoot = document.getElementById('html-root');
  const container = document.getElementById('main-container');
  const titleEl = document.getElementById('hero-title');
  const subEl = document.getElementById('hero-sub');
  const dividerEl = document.getElementById('divider-text');
  const clockCorner = document.getElementById('clock-corner');
  const clockEl = document.getElementById('clock-text');
  const toastEl = document.getElementById('toast');
  const langButtons = document.querySelectorAll('.lang-btn');
  const translatableLinks = document.querySelectorAll('[data-i18n]');

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const allowMotion = !prefersReduced;

  let currentLang = 'ru';

  function getLang() {
    const stored = localStorage.getItem('lang');
    if (stored === 'ru' || stored === 'en') return stored;
    return 'ru';
  }

  function setText(el, text, instant) {
    if (!el) return;
    if (instant || !allowMotion) { el.textContent = text; return; }
    el.style.opacity = 0;
    setTimeout(function() { el.textContent = text; el.style.opacity = 1; }, 180);
  }

  const TIMEZONE = 'Asia/Yekaterinburg';
  function updateClock() {
    if (!clockEl) return;
    try {
      const now = new Date();
      const time = new Intl.DateTimeFormat(currentLang === 'ru' ? 'ru-RU' : 'en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TIMEZONE
      }).format(now);
      clockEl.textContent = time;
      if (clockCorner) clockCorner.title = currentLang === 'ru' ? 'Время в Екатеринбурге' : 'Time in Yekaterinburg';
    } catch (e) { /* если часовой пояс некорректен — просто не показываем время */ }
  }

  function applyLanguage(lang, instant) {
    currentLang = lang;
    htmlRoot.setAttribute('lang', lang);
    langButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
    const t = translations[lang];
    setText(titleEl, t.title, instant);
    setText(subEl, t.sub, instant);
    setText(dividerEl, t.divider, instant);
    translatableLinks.forEach(link => {
      const key = link.dataset.i18n;
      const span = link.querySelector('.btn-text');
      if (t[key] && span) setText(span, t[key], instant);
    });
    updateClock();
    localStorage.setItem('lang', lang);
  }

  applyLanguage(getLang(), true);
  setInterval(updateClock, 30000);

  langButtons.forEach(btn => {
    btn.addEventListener('click', function() {
      const lang = this.dataset.lang;
      if (lang !== currentLang) applyLanguage(lang);
    });
  });

  window.addEventListener('load', function() {
    setTimeout(function() {
      container.classList.add('loaded');
      if (clockCorner) clockCorner.classList.add('show');
      const fab = document.getElementById('vcard-fab');
      if (fab) fab.classList.add('show');
    }, 50);
  });

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function() { toastEl.classList.remove('show'); }, 1800);
  }

  const vcardBtn = document.getElementById('vcard-fab');
  if (vcardBtn) {
    const vcard =
      "BEGIN:VCARD\r\nVERSION:3.0\r\nFN:Kda2210\r\nTEL;TYPE=CELL:+79199330482\r\n" +
      "EMAIL:kda2210@duck.com\r\nURL:tg://resolve?domain=kda2210\r\nURL:https://vk.com/kda2210\r\nEND:VCARD\r\n";
    vcardBtn.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
    vcardBtn.setAttribute('target', '_blank');
    vcardBtn.setAttribute('rel', 'noopener');
  }

  const phoneBtn = document.getElementById('phone-btn');
  if (phoneBtn && navigator.clipboard && window.matchMedia('(pointer: fine)').matches) {
    phoneBtn.addEventListener('click', function(e) {
      e.preventDefault();
      navigator.clipboard.writeText(phoneBtn.dataset.phone).then(function() {
        showToast(translations[currentLang].copied);
      }).catch(function() {});
    });
  }

  function addRipple(e, btn) {
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size + 'px';
    const clientX = e.clientX !== undefined ? e.clientX : rect.left + rect.width / 2;
    const clientY = e.clientY !== undefined ? e.clientY : rect.top + rect.height / 2;
    span.style.left = (clientX - rect.left - size / 2) + 'px';
    span.style.top = (clientY - rect.top - size / 2) + 'px';
    btn.appendChild(span);
    setTimeout(function() { span.remove(); }, 650);
  }
  document.querySelectorAll('.link-btn, .vcard-fab').forEach(function(btn) {
    btn.addEventListener('pointerdown', function(e) { addRipple(e, btn); });
  });

  const avatarWrap = document.getElementById('avatar-wrap');
  let tapCount = 0, tapTimer = null;
  function spawnSparks() {
    const count = 10;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const dist = 50 + Math.random() * 30;
      const s = document.createElement('span');
      s.className = 'spark';
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      avatarWrap.appendChild(s);
      setTimeout(function() { s.remove(); }, 950);
    }
  }
  if (avatarWrap) {
    avatarWrap.addEventListener('click', function() {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function() { tapCount = 0; }, 1200);
      if (tapCount >= 5) {
        tapCount = 0;
        if (allowMotion) spawnSparks();
        showToast(translations[currentLang].secret);
      }
    });
  }

  const root = document.documentElement;
  function setSpot(xPct, yPct) {
    root.style.setProperty('--mx', xPct.toFixed(1) + '%');
    root.style.setProperty('--my', yPct.toFixed(1) + '%');
  }

  if (allowMotion) {
    let lastMove = 0, usingPointer = false;

    window.addEventListener('pointermove', function(e) {
      usingPointer = true;
      lastMove = performance.now();
      setSpot(e.clientX / window.innerWidth * 100, e.clientY / window.innerHeight * 100);
    }, { passive: true });

    window.addEventListener('touchmove', function(e) {
      if (!e.touches[0]) return;
      usingPointer = true;
      lastMove = performance.now();
      const t = e.touches[0];
      setSpot(t.clientX / window.innerWidth * 100, t.clientY / window.innerHeight * 100);
    }, { passive: true });

    function idleLoop(ts) {
      if (!usingPointer || ts - lastMove > 2500) {
        setSpot(50 + Math.sin(ts / 4200) * 22, 32 + Math.cos(ts / 5300) * 14);
      }
      requestAnimationFrame(idleLoop);
    }
    requestAnimationFrame(idleLoop);

    if (avatarWrap && window.matchMedia('(pointer: fine)').matches) {
      avatarWrap.addEventListener('pointermove', function(e) {
        const rect = avatarWrap.getBoundingClientRect();
        const relX = (e.clientX - rect.left) / rect.width - 0.5;
        const relY = (e.clientY - rect.top) / rect.height - 0.5;
        avatarWrap.style.transform =
          'perspective(500px) rotateX(' + (-relY * 18).toFixed(2) + 'deg) rotateY(' + (relX * 18).toFixed(2) + 'deg)';
      });
      avatarWrap.addEventListener('pointerleave', function() {
        avatarWrap.style.transform = '';
      });
    }
  } else {
    setSpot(50, 32);
  }
})();
</script>
</body>
</html>
