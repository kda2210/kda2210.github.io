.spotlight{

.container{ position:relative; z-index:1; width:100%; max-width:380px; text-align:center; }

@media (prefers-reduced-motion:no-preference){

}
.loaded .hero, .loaded .actions{ opacity:1; transform:translateY(0); }

.avatar-wrap{

  margin:0 auto 24px;
  transition: transform .15s ease-out;
  will-change: transform;
}
.avatar-wrap::before{
  content:'';
  position:absolute;

  border-radius:50%;
  background:conic-gradient(from 0deg, var(--plum), var(--plum-light), var(--plum));
  filter:blur(20px);

}
@media (prefers-reduced-motion:no-preference){
  .avatar-wrap::before{ animation: spin 9s linear infinite; }
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.avatar{
  position:relative; z-index:1; display:block;
  width:112px; height:112px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--void);
  background:#2a2a2a;
}
.avatar-error{

.link-btn{

.link-btn svg{ width:20px; height:20px; fill:currentColor; flex-shrink:0; }
.link-btn:hover{ background:var(--plum); border-color:var(--plum); box-shadow:0 10px 24px rgba(84,0,92,.45); }
.link-btn:active{ transform:scale(.98); }
.link-btn:focus-visible{ outline:2px solid var(--mist); outline-offset:3px; }

.divider{ display:flex; align-items:center; gap:14px; color:var(--mist-dim); font-size:13px; margin:20px 0; }
.divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line); }

.lang-switch{ margin-top:28px; display:inline-flex; gap:2px; padding:3px; border:1px solid var(--line); border-radius:999px; }
.lang-btn{ background:transparent; border:0; color:var(--mist-dim); padding:6px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600; transition:.2s; }
.lang-btn.active{ background:var(--plum); color:#fff; }
.lang-btn:hover{ color:var(--mist); }
.lang-btn:focus-visible{ outline:2px solid var(--mist); outline-offset:2px; }

@media (max-width:480px){

<script>
(function() {
  const translations = {
    ru: { title:'Важно, что внутри.', sub:'Выбирай удобный способ связи.', divider:'или',
          tg:"Написать в Telegram", email:"Написать на почту", vk:"Написать ВКонтакте", phone:"Позвонить" },
    en: { title:'What matters is what\u2019s inside.', sub:'Choose a convenient way to get in touch.', divider:'or',
          tg:"Write in Telegram", email:"Write an email", vk:"Write in VK", phone:"Call" }
  };

  const htmlRoot = document.getElementById('html-root');
  const container = document.getElementById('main-container');
  const titleEl = document.getElementById('hero-title');
  const subEl = document.getElementById('hero-sub');
  const dividerEl = document.getElementById('divider-text');
  const langButtons = document.querySelectorAll('.lang-btn');
  const translatableLinks = document.querySelectorAll('[data-i18n]');

  function getLang() {
    const stored = localStorage.getItem('lang');
    if (stored === 'ru' || stored === 'en') return stored;
    return 'ru';
  }
  function applyLanguage(lang) {
    htmlRoot.setAttribute('lang', lang);
    langButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
    const t = translations[lang];
    if (titleEl) titleEl.textContent = t.title;
    if (subEl) subEl.textContent = t.sub;
    if (dividerEl) dividerEl.textContent = t.divider;
    translatableLinks.forEach(link => {
      const key = link.dataset.i18n;
      const span = link.querySelector('.btn-text');
      if (t[key] && span) span.textContent = t[key];
    });
    localStorage.setItem('lang', lang);
  }
  applyLanguage(getLang());
  langButtons.forEach(btn => {
    btn.addEventListener('click', function() {
      const lang = this.dataset.lang;
      if (lang !== htmlRoot.getAttribute('lang')) applyLanguage(lang);
    });
  });

  window.addEventListener('load', function() {
    setTimeout(function() { container.classList.add('loaded'); }, 50);
  });

  const root = document.documentElement;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: no-preference)').matches === false;

  function setSpot(xPct, yPct) {
    root.style.setProperty('--mx', xPct.toFixed(1) + '%');
    root.style.setProperty('--my', yPct.toFixed(1) + '%');
  }

  if (!reduceMotion) {
    let lastMove = 0;
    let usingPointer = false;

    window.addEventListener('pointermove', function(e) {
      usingPointer = true;
      lastMove = performance.now();
      setSpot(e.clientX / window.innerWidth * 100, e.clientY / window.innerHeight * 100);
    }, { passive: true });

    window.addEventListener('touchmove', function(e) {
      if (!e.touches[0]) return;
      usingPointer = true;
      lastMove = performance.now();
      const t = e.touches[0];
      setSpot(t.clientX / window.innerWidth * 100, t.clientY / window.innerHeight * 100);
    }, { passive: true });

    function idleLoop(ts) {
      if (!usingPointer || ts - lastMove > 2500) {
        setSpot(50 + Math.sin(ts / 4200) * 22, 32 + Math.cos(ts / 5300) * 14);
      }
      requestAnimationFrame(idleLoop);
    }
    requestAnimationFrame(idleLoop);

    const avatarWrap = document.getElementById('avatar-wrap');
    if (avatarWrap && window.matchMedia('(pointer: fine)').matches) {
      avatarWrap.addEventListener('pointermove', function(e) {
        const rect = avatarWrap.getBoundingClientRect();
        const relX = (e.clientX - rect.left) / rect.width - 0.5;
        const relY = (e.clientY - rect.top) / rect.height - 0.5;
        avatarWrap.style.transform =
          'perspective(500px) rotateX(' + (-relY * 18).toFixed(2) + 'deg) rotateY(' + (relX * 18).toFixed(2) + 'deg)';
      });
      avatarWrap.addEventListener('pointerleave', function() {
        avatarWrap.style.transform = '';
      });
    }
  } else {
    setSpot(50, 32);
  }
})();
</script>
