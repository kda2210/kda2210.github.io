<style>
:root{
  --void: #120417;
  --plum: #54005c;
  --plum-light: #c17ed6;
  --mist: #f6eefa;
  --mist-dim: rgba(246,238,250,.68);
  --line: rgba(246,238,250,.16);

}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color:var(--mist);
  background-color: var(--void);
  position:relative;
  overflow-x:hidden;
}

.bg-photo{
  position:fixed;
  inset:-6%;
  z-index:-2;
  background-image: url('background.webp');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transition: transform .15s ease-out;
  will-change: transform;
}
.bg-tint{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background: linear-gradient(rgba(18,4,23,.82), rgba(18,4,23,.88));
}

.spotlight{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background: radial-gradient(600px circle at var(--mx) var(--my), rgba(193,126,214,.38), transparent 60%);
  mix-blend-mode: screen;
}

.rainbow-overlay{
  position:fixed; inset:0; pointer-events:none; z-index:4;
  background: conic-gradient(from 0deg, #ff3d3d, #ff9d3d, #f6ff3d, #3dff6b, #3dc9ff, #7a3dff, #ff3dcf, #ff3d3d);
  opacity:0;
  mix-blend-mode: color;
}
.rainbow-overlay.active{
  animation: rainbow-arc 7s ease-in-out 1;
}
@keyframes rainbow-arc{
  0%{ opacity:0; transform:rotate(0deg) scale(1.3); }
  15%{ opacity:.4; transform:rotate(160deg) scale(1.4); }
  50%{ opacity:.45; transform:rotate(650deg) scale(1.6); }
  85%{ opacity:.3; transform:rotate(1050deg) scale(1.4); }
  100%{ opacity:0; transform:rotate(1200deg) scale(1.2); }
}

.container{ position:relative; z-index:1; width:100%; max-width:380px; text-align:center; transition: transform .1s ease-out; will-change: transform; }

.hero, .actions{ opacity:0; transform:translateY(16px); }
@media (prefers-reduced-motion:no-preference){
  .hero, .actions{ transition: opacity .7s ease, transform .7s ease; }
  .actions{ transition-delay:.15s; }
}
.loaded .hero, .loaded .actions{ opacity:1; transform:translateY(0); }

.avatar-wrap{
  position:relative;
  width:112px; height:112px;
  margin:0 auto 24px;
  transition: transform .15s ease-out;
  will-change: transform;
  cursor:pointer;
  touch-action: manipulation;
}
.avatar-wrap::before{
  content:'';
  position:absolute;
  inset:-16px;
  border-radius:50%;
  background:conic-gradient(from 0deg, var(--plum), var(--plum-light), var(--plum));
  filter:blur(20px);
  opacity:.6;
}
@media (prefers-reduced-motion:no-preference){
  .avatar-wrap::before{ animation: spin 9s linear infinite; }
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.avatar{
  position:relative; z-index:1; display:block;
  width:112px; height:112px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--void);
  background:#2a2a2a;
}
.avatar-failed .avatar{ opacity:0; }
.avatar-failed::after{
  content:'👤';
  content:'👤' / '';
  position:absolute; inset:0; z-index:1; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  border:3px solid var(--void);
  background: linear-gradient(135deg, var(--plum) 0%, #764ba2 100%);
  font-size:40px; color:#fff;
}

.spark{
  position:absolute;
  top:50%; left:50%;
  width:6px; height:6px;
  margin:-3px 0 0 -3px;
  border-radius:50%;
  background:var(--plum-light);
  pointer-events:none;
  z-index:2;
  animation: spark-burst .9s ease-out forwards;
}
@keyframes spark-burst{
  to{ transform: translate(var(--dx), var(--dy)) scale(0); opacity:0; }
}

@keyframes freakout-shake-arc{
  0%{ transform:translate(0,0) rotate(0deg) skew(0deg,0deg) scale(1); }
  5%{ transform:translate(-2px,1px) rotate(-1deg) skew(1deg,0.5deg) scale(1.005); }
  10%{ transform:translate(3px,-2px) rotate(1deg) skew(-1deg,-0.5deg) scale(0.995); }
  15%{ transform:translate(-4px,3px) rotate(-2deg) skew(2deg,1deg) scale(1.01); }
  20%{ transform:translate(5px,-4px) rotate(2deg) skew(-2deg,-1deg) scale(0.99); }
  25%{ transform:translate(-7px,5px) rotate(-3deg) skew(3deg,1.5deg) scale(1.015); }
  30%{ transform:translate(8px,-6px) rotate(4deg) skew(-3deg,-1.5deg) scale(0.985); }
  35%{ transform:translate(-10px,7px) rotate(-4deg) skew(4deg,2deg) scale(1.02); }

  50%{ transform:translate(12px,-10px) rotate(5deg) skew(-5deg,-2.5deg) scale(0.98); }
  55%{ transform:translate(-11px,9px) rotate(-5deg) skew(4deg,2deg) scale(1.02); }
  60%{ transform:translate(10px,-8px) rotate(4deg) skew(-4deg,-2deg) scale(0.985); }
  65%{ transform:translate(-9px,7px) rotate(-4deg) skew(3deg,1.5deg) scale(1.015); }
  70%{ transform:translate(8px,-6px) rotate(3deg) skew(-3deg,-1deg) scale(0.99); }
  75%{ transform:translate(-6px,5px) rotate(-2deg) skew(2deg,1deg) scale(1.01); }
  80%{ transform:translate(5px,-4px) rotate(2deg) skew(-2deg,-0.5deg) scale(0.995); }
  85%{ transform:translate(-3px,3px) rotate(-1deg) skew(1deg,0.5deg) scale(1.005); }
  90%{ transform:translate(2px,-2px) rotate(1deg) skew(-1deg,0deg) scale(0.998); }
  95%{ transform:translate(-1px,1px) rotate(0deg) skew(0.5deg,0deg) scale(1); }
  100%{ transform:translate(0,0) rotate(0deg) skew(0deg,0deg) scale(1); }

.container.freakout{ animation: freakout-shake-arc 7s ease-in-out 1; filter: saturate(1.3) contrast(1.08); }

@keyframes freakout-avatar{
  0%{ transform:scale(1) rotate(0deg) skew(0deg); filter:hue-rotate(0deg) saturate(1) contrast(1); }

  40%{ transform:scale(0.82) rotate(16deg) skew(-5deg); filter:hue-rotate(150deg) saturate(2.4) contrast(1.4); }
  60%{ transform:scale(1.15) rotate(-11deg) skew(5deg); filter:hue-rotate(230deg) saturate(2.2) contrast(1.3); }
  80%{ transform:scale(0.88) rotate(13deg) skew(-4deg); filter:hue-rotate(300deg) saturate(1.8) contrast(1.2); }

.avatar-wrap.freakout-avatar{ animation: freakout-avatar .4s ease-in-out infinite; }

@keyframes text-glitch{
  0%,100%{ text-shadow:none; transform:translate(0,0) skewX(0deg); }
  15%{ text-shadow:-3px 0 #ff3d3d, 3px 0 #3dc9ff; transform:translate(-2px,0) skewX(3deg); }
  30%{ text-shadow:3px 0 #f6ff3d, -3px 0 #7a3dff; transform:translate(2px,0) skewX(-3deg); }
  45%{ text-shadow:-2px 0 #3dff6b, 2px 0 #ff3dcf; transform:translate(-1px,0) skewX(2deg); }
  60%{ text-shadow:2px 0 #ff9d3d, -2px 0 #3dc9ff; transform:translate(1px,0) skewX(-2deg); }
  75%{ text-shadow:-3px 0 #ff3dcf, 3px 0 #3dff6b; transform:translate(-2px,0) skewX(3deg); }
  90%{ text-shadow:2px 0 #7a3dff, -2px 0 #f6ff3d; transform:translate(1px,0) skewX(-1deg); }

.link-btn{

.link-btn:focus-visible{ outline:2px solid var(--mist); outline-offset:3px; }

.ripple{

@keyframes ripple-anim{ to{ transform:scale(2.4); opacity:0; } }
@media (prefers-reduced-motion:reduce){

.divider{ display:flex; align-items:center; gap:14px; color:var(--mist-dim); font-size:13px; margin:20px 0; }
.divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line); }

.lang-switch{ margin-top:28px; display:inline-flex; gap:2px; padding:3px; border:1px solid var(--line); border-radius:999px; }
.lang-btn{ position:relative; background:transparent; border:0; color:var(--mist-dim); padding:6px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600; transition:.2s; touch-action: manipulation; }

.toast{

@media (max-width:480px){

  const allowMotion = !prefersReduced;

  // Карточка появляется после полной загрузки, но не позже чем через 2 с,
  // даже если аватар из сети не загружается
  let revealed = false;
  function reveal() {
    if (revealed) return;
    revealed = true;
    container.classList.add('loaded');
    if (clockCorner) clockCorner.classList.add('show');
    const fab = document.getElementById('vcard-fab');
    if (fab) fab.classList.add('show');
  }
  window.addEventListener('load', function() {
    setTimeout(function() {
      const fonts = document.fonts && document.fonts.ready;
      if (fonts) fonts.then(reveal, reveal); else reveal();
    }, 50);
  });
  setTimeout(reveal, 2000);

  let currentLang = 'ru';

  function getLang() {
    try {
      const stored = localStorage.getItem('lang');
      if (stored === 'ru' || stored === 'en') return stored;
    } catch (e) {}
    return 'ru';
  }

  function saveLang(lang) {
    try { localStorage.setItem('lang', lang); } catch (e) {}
  }

  function setText(el, text, instant) {
    if (!el) return;
    if (instant || !allowMotion) { el.textContent = text; return; }
    el.style.opacity = 0;
    setTimeout(function() { el.textContent = text; el.style.opacity = 1; }, 180);
  }

  const TIMEZONE = 'Asia/Yekaterinburg';
  const clockFormats = {};
  function updateClock() {
    if (!clockEl) return;
    try {
      if (!clockFormats[currentLang]) {
        clockFormats[currentLang] = new Intl.DateTimeFormat(currentLang === 'ru' ? 'ru-RU' : 'en-GB', {
          hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23', timeZone: TIMEZONE
        });
      }
      clockEl.textContent = clockFormats[currentLang].format(new Date());
      if (clockCorner) {
        const label = currentLang === 'ru' ? 'Время в Екатеринбурге' : 'Time in Yekaterinburg';
        if (clockCorner.title !== label) {
          clockCorner.title = label;
          clockCorner.setAttribute('aria-label', label);
        }
      }
    } catch (e) { /* если часовой пояс некорректен — просто не показываем время */ }
  }

  function applyLanguage(lang, instant) {
    currentLang = lang;
    htmlRoot.setAttribute('lang', lang);
    langButtons.forEach(btn => {
      const isActive = btn.dataset.lang === lang;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', String(isActive));
    });
    const t = translations[lang];
    setText(titleEl, t.title, instant);
    setText(subEl, t.sub, instant);
    setText(dividerEl, t.divider, instant);
    document.title = t.title;
    if (avatarImg) avatarImg.alt = t.avatarAlt;
    translatableLinks.forEach(link => {
      const key = link.dataset.i18n;
      const span = link.querySelector('.btn-text');
      if (t[key] && span) setText(span, t[key], instant);
    });
    updateClock();
    saveLang(lang);
  }

  applyLanguage(getLang(), true);
  setInterval(updateClock, 1000);

  langButtons.forEach(btn => {
    btn.addEventListener('click', function() {
      const lang = this.dataset.lang;
      if (lang !== currentLang) applyLanguage(lang);
    });
  });

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function() { toastEl.classList.remove('show'); }, 1800);
  }

  const vcardBtn = document.getElementById('vcard-fab');
  if (vcardBtn) {
    const vcard =
      "BEGIN:VCARD\r\nVERSION:3.0\r\nN:;Kda2210;;;\r\nFN:Kda2210\r\nTEL;TYPE=CELL:+79199330482\r\n" +
      "EMAIL:kda2210@duck.com\r\nURL:tg://resolve?domain=kda2210\r\nURL:https://vk.com/kda2210\r\nEND:VCARD\r\n";
    vcardBtn.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
    vcardBtn.setAttribute('download', 'kda2210.vcf');
  }

  const phoneBtn = document.getElementById('phone-btn');
  if (phoneBtn && navigator.clipboard && window.matchMedia('(pointer: fine)').matches) {
    phoneBtn.addEventListener('click', function(e) {
      e.preventDefault();
      navigator.clipboard.writeText(phoneBtn.dataset.phone).then(function() {
        showToast(translations[currentLang].copied);
      }).catch(function() {
        showToast(phoneBtn.dataset.phone);   // не удалось скопировать — хотя бы показываем номер
      });
    });
  }

  function addRipple(e, btn) {
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size + 'px';
    const clientX = e.clientX !== undefined ? e.clientX : rect.left + rect.width / 2;
    const clientY = e.clientY !== undefined ? e.clientY : rect.top + rect.height / 2;
    span.style.left = (clientX - rect.left - size / 2) + 'px';
    span.style.top = (clientY - rect.top - size / 2) + 'px';
    btn.appendChild(span);
    setTimeout(function() { span.remove(); }, 650);
  }
  document.querySelectorAll('.link-btn, .vcard-fab').forEach(function(btn) {
    btn.addEventListener('pointerdown', function(e) { if (e.button === 0) addRipple(e, btn); });
  });

  const avatarWrap = document.getElementById('avatar-wrap');
  const rainbowOverlay = document.getElementById('rainbow-overlay');
  let tapCount = 0, tapTimer = null;
  let freaking = false, tiltPaused = false;

  function spawnSparks() {
    const count = 10;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const dist = 60 + Math.random() * 45;
      const s = document.createElement('span');
      s.className = 'spark';
      s.style.background = 'hsl(' + Math.floor(Math.random() * 360) + ',90%,65%)';
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      avatarWrap.appendChild(s);
      setTimeout(function() { s.remove(); }, 950);
    }
  }

  let audioCtx = null;
  function playTone(freqStart, freqEnd, duration, type, peakGain, delaySec) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t0 = audioCtx.currentTime + (delaySec || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(Math.max(freqStart, 1), t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + duration);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(peakGain, t0 + duration * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    } catch (e) { /* аудио недоступно — просто без звука */ }
  }

  function triggerFreakout() {
    if (freaking) return;
    freaking = true;

    if (!allowMotion) {
      freaking = false;
      showToast(translations[currentLang].secret);
      return;
    }

    tiltPaused = true;
    avatarWrap.style.transform = '';
    container.style.transform = '';
    container.classList.add('freakout');
    avatarWrap.classList.add('freakout-avatar');
    titleEl.classList.add('freakout-text');
    if (rainbowOverlay) rainbowOverlay.classList.add('active');
    playTone(140, 820, 0.5, 'sawtooth', 0.05);

    const sparkTimer = setInterval(spawnSparks, 140);
    const spotTimer = setInterval(function() {
      setSpot(Math.random() * 100, Math.random() * 100);
    }, 60);

    setTimeout(function() {
      spawnSparks(); spawnSparks(); spawnSparks();
      playTone(1500, 2400, 0.35, 'sine', 0.04);
    }, 6300);

    setTimeout(function() {
      clearInterval(sparkTimer);
      clearInterval(spotTimer);
      container.classList.remove('freakout');
      avatarWrap.classList.remove('freakout-avatar');
      titleEl.classList.remove('freakout-text');
      if (rainbowOverlay) rainbowOverlay.classList.remove('active');
      tiltPaused = false;
      freaking = false;
      showToast(translations[currentLang].secret);
    }, 7000);
  }

  if (avatarWrap) {
    avatarWrap.addEventListener('click', function() {
      if (freaking) return;
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function() { tapCount = 0; }, 1200);
      if (tapCount >= 5) {
        tapCount = 0;
        triggerFreakout();
      }
    });
  }

  const spotEl = document.querySelector('.spotlight');
  function setSpot(xPct, yPct) {
    if (!spotEl) return;
    spotEl.style.setProperty('--mx', xPct.toFixed(1) + '%');
    spotEl.style.setProperty('--my', yPct.toFixed(1) + '%');
  }

  if (allowMotion) {
    let lastMove = 0, usingPointer = false;

    window.addEventListener('pointermove', function(e) {
      usingPointer = true;
      lastMove = performance.now();
      setSpot(e.clientX / window.innerWidth * 100, e.clientY / window.innerHeight * 100);
    }, { passive: true });

    window.addEventListener('touchmove', function(e) {
      if (!e.touches[0]) return;
      usingPointer = true;
      lastMove = performance.now();
      const t = e.touches[0];
      setSpot(t.clientX / window.innerWidth * 100, t.clientY / window.innerHeight * 100);
    }, { passive: true });

    const idleLoop = function(ts) {
      if (!usingPointer || ts - lastMove > 2500) {
        setSpot(50 + Math.sin(ts / 4200) * 22, 32 + Math.cos(ts / 5300) * 14);
      }
      requestAnimationFrame(idleLoop);
    };
    requestAnimationFrame(idleLoop);

    if (avatarWrap && window.matchMedia('(pointer: fine)').matches) {
      avatarWrap.addEventListener('pointermove', function(e) {
        if (tiltPaused) return;
        const rect = avatarWrap.getBoundingClientRect();
        const relX = (e.clientX - rect.left) / rect.width - 0.5;
        const relY = (e.clientY - rect.top) / rect.height - 0.5;
        avatarWrap.style.transform =
          'perspective(500px) rotateX(' + (-relY * 18).toFixed(2) + 'deg) rotateY(' + (relX * 18).toFixed(2) + 'deg)';
      });
      avatarWrap.addEventListener('pointerleave', function() {
        avatarWrap.style.transform = '';
      });
    }

    if (!window.matchMedia('(pointer: fine)').matches && typeof DeviceOrientationEvent !== 'undefined') {
      const bgPhoto = document.getElementById('bg-photo');
      let gyroBaseline = null;
      const handleOrientation = function(e) {
        if (tiltPaused || e.beta === null || e.gamma === null) return;
        if (!gyroBaseline) { gyroBaseline = { beta: e.beta, gamma: e.gamma }; return; }
        const dBeta = e.beta - gyroBaseline.beta;
        const dGamma = e.gamma - gyroBaseline.gamma;
        const clamp = function(v, m) { return Math.max(-m, Math.min(m, v)); };

        const rotateX = clamp(-dBeta * 0.35, 9);
        const rotateY = clamp(dGamma * 0.35, 9);
        container.style.transform =
          'perspective(800px) rotateX(' + rotateX.toFixed(2) + 'deg) rotateY(' + rotateY.toFixed(2) + 'deg)';

        if (bgPhoto) {
          const bgX = clamp(-dGamma * 1.0, 20);
          const bgY = clamp(-dBeta * 0.7, 20);
          bgPhoto.style.transform = 'translate(' + bgX.toFixed(1) + 'px, ' + bgY.toFixed(1) + 'px)';
        }

        setSpot(
          Math.max(8, Math.min(92, 50 + dGamma * 1.4)),
          Math.max(8, Math.min(92, 32 + dBeta * 1.0))
        );
      };
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        const requestGyro = function() {
          DeviceOrientationEvent.requestPermission().then(function(state) {
            if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
          }).catch(function() {});
          window.removeEventListener('touchend', requestGyro);
        };
        window.addEventListener('touchend', requestGyro, { once: true });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }
  } else {
    setSpot(50, 32);
  }
})();
</script>
</body>
</html>
