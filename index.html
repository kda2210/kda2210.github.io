<head>
    <meta charset="UTF-8">

    <link rel="alternate" hreflang="en" href="https://kda2210.github.io/?lang=en">

    <!-- Фавикон и превью для соцсетей -->
    <link rel="icon" href="https://avatars.githubusercontent.com/u/193797799">
    <link rel="apple-touch-icon" sizes="300x300" href="https://avatars.githubusercontent.com/u/193797799">
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/193797799">

    <meta property="og:description" content="Свяжитесь со мной удобным способом">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #18001a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Все элементы изначально скрыты (кроме переключателя языка, он не участвует в fade) */
        .avatar, .bio, .link-btn, .divider {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        /* Класс loaded добавляет анимацию */
        .loaded .avatar,
        .loaded .bio,
        .loaded .link-btn,
        .loaded .divider {
            opacity: 1;
            transform: translateY(0);
        }

        /* Задержки для последовательного появления */
        .loaded .avatar           { transition-delay: 0.1s; }
        .loaded .bio              { transition-delay: 0.2s; }
        .loaded .link-btn:nth-of-type(1) { transition-delay: 0.3s; } /* Telegram */
        .loaded .link-btn:nth-of-type(2) { transition-delay: 0.35s; } /* Почта */
        .loaded .link-btn:nth-of-type(3) { transition-delay: 0.4s; } /* VK */
        .loaded .divider          { transition-delay: 0.5s; }
        .loaded .link-btn:nth-of-type(4) { transition-delay: 0.55s; } /* Звонок */

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #54005c;
        }

        .bio {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #54005c;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 40px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 500;
            border: 1px solid #54005c;
            transition: background 0.3s, transform 0.2s;
        }

        .link-btn i {
            font-size: 1.2em;
        }

        .link-btn:hover {
            background: #6b007a;
            transform: scale(1.02);
        }

        .link-btn.tg {
            animation: heartPulse 1.5s infinite;
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .divider {
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 10px;
        }

        .divider span {
            font-size: 20px;
        }

        /* Переключатель языка */
        .lang-switch {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .lang-btn.active {
            background: #54005c;
            border-color: #54005c;
            color: #fff;
        }

        .lang-btn:hover {
            border-color: #fff;
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/193797799" alt="Аватар">

        <p class="bio" id="bio-text">Выбирай удобный способ связи. Буду ждать 🙂</p>

        <a href="https://t.me/k_d_a_1_3_7" class="link-btn tg" target="_blank" rel="noopener" data-i18n="tg">
            <i class="fa-brands fa-telegram"></i> <span class="btn-text">Написать в Telegram</span>
        </a>
        <a href="mailto:knyazev.fx@gmail.com" class="link-btn" data-i18n="email">
            <i class="fa-solid fa-envelope"></i> <span class="btn-text">Написать на почту</span>
        </a>
        <a href="https://vk.com/k_d_a_1_3_7" class="link-btn" target="_blank" rel="noopener" data-i18n="vk">
            <i class="fa-brands fa-vk"></i> <span class="btn-text">Написать ВКонтакте</span>
        </a>

        <div class="divider">
            <span>⌄</span>
        </div>

        <a href="tel:+79199330482" class="link-btn" data-i18n="phone">
            <i class="fa-solid fa-phone"></i> <span class="btn-text">Позвонить</span>
        </a>

        <!-- Переключатель языка -->
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru">🇷🇺 RU</button>
            <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
        </div>
    </div>

    <script>
    (function() {
        // Объекты переводов
        const translations = {
            ru: {
                bio: "Выбирай удобный способ связи. Буду ждать 🙂",
                tg:   "Написать в Telegram",
                email: "Написать на почту",
                vk:   "Написать ВКонтакте",
                phone: "Позвонить"
            },
            en: {
                bio: "Choose a convenient way to contact me. Looking forward 🙂",
                tg:   "Write in Telegram",
                email: "Write an email",
                vk:   "Write in VK",
                phone: "Call"
            }
        };

        const htmlRoot = document.getElementById('html-root');
        const container = document.getElementById('main-container');
        const bioEl = document.getElementById('bio-text');
        const langButtons = document.querySelectorAll('.lang-btn');
        const btnTextSpans = document.querySelectorAll('.btn-text'); // подписи в кнопках
        const translatableLinks = document.querySelectorAll('[data-i18n]'); // ссылки с data-i18n

        // Определяем язык
        function getLang() {
            // 1. Проверяем параметр ?lang=
            const params = new URLSearchParams(window.location.search);
            const urlLang = params.get('lang');
            if (urlLang && (urlLang === 'ru' || urlLang === 'en')) {
                return urlLang;
            }
            // 2. Проверяем сохранённый выбор
            const stored = localStorage.getItem('lang');
            if (stored && (stored === 'ru' || stored === 'en')) {
                return stored;
            }
            // 3. Язык браузера (первые два символа)
            const browserLang = navigator.language.slice(0, 2);
            if (browserLang === 'ru') return 'ru';
            // По умолчанию — русский
            return 'ru';
        }

        function applyLanguage(lang) {
            // Устанавливаем атрибут lang у html
            htmlRoot.setAttribute('lang', lang);

            // Обновляем активную кнопку
            langButtons.forEach(btn => {
                if (btn.dataset.lang === lang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Меняем тексты в элементах
            const t = translations[lang];
            if (bioEl) bioEl.textContent = t.bio;

            // Обновляем текст внутри каждой ссылки с data-i18n
            translatableLinks.forEach(link => {
                const key = link.dataset.i18n;
                if (t[key]) {
                    // Находим span с классом btn-text внутри ссылки
                    const span = link.querySelector('.btn-text');
                    if (span) span.textContent = t[key];
                }
            });

            // Обновляем параметр URL без перезагрузки (для SEO)
            if (history.replaceState) {
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('lang', lang);
                history.replaceState(null, '', newUrl.toString());
            }

            // Сохраняем выбор
            localStorage.setItem('lang', lang);
        }

        // Инициализация языка
        const currentLang = getLang();
        applyLanguage(currentLang);

        // Обработчики переключения
        langButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const lang = this.dataset.lang;
                if (lang !== htmlRoot.getAttribute('lang')) {
                    applyLanguage(lang);
                }
            });
        });

        // Запускаем плавное появление после загрузки страницы
        window.addEventListener('load', function() {
            // Даём небольшую задержку, чтобы гарантированно сработало
            setTimeout(function() {
                container.classList.add('loaded');
            }, 50);
        });
    })();
    </script>
</body>
</html>
