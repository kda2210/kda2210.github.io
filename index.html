    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #18001a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Плавное появление (анимация теперь учитывает prefers-reduced-motion) */
        .avatar, .bio, .link-btn, .divider {
            opacity: 0;
            transform: translateY(20px);
        }

        @media (prefers-reduced-motion: no-preference) {
            .avatar, .bio, .link-btn, .divider {
                transition: opacity 0.6s ease, transform 0.6s ease;
            }
        }

        .loaded .avatar,
        .loaded .bio,
        .loaded .link-btn,
        .loaded .divider {
            opacity: 1;
            transform: translateY(0);
        }

        .loaded .avatar           { transition-delay: 0.1s; }
        .loaded .bio              { transition-delay: 0.2s; }
        .loaded .link-btn:nth-of-type(1) { transition-delay: 0.3s; }
        .loaded .link-btn:nth-of-type(2) { transition-delay: 0.35s; }
        .loaded .link-btn:nth-of-type(3) { transition-delay: 0.4s; }
        .loaded .divider          { transition-delay: 0.5s; }
        .loaded .link-btn:nth-of-type(4) { transition-delay: 0.55s; }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #54005c;
        }

        .bio {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .bio .icon {
            color: #54005c;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #54005c;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 40px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 500;
            border: 1px solid #54005c;
            transition: background 0.3s, transform 0.2s;
        }

        .link-btn .icon {
            width: 1.2em;
            height: 1.2em;
            fill: currentColor;
            flex-shrink: 0;
        }

        .link-btn:hover {
            background: #6b007a;
            transform: scale(1.02);
        }

        /* Пульсация Telegram – только 3 повторения, затем остановка */
        @media (prefers-reduced-motion: no-preference) {
            .link-btn.tg {
                animation: heartPulse 1.5s 3 forwards;
            }
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .divider {
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 10px;
        }

        .divider span {
            font-size: 20px;
        }

        .lang-switch {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .lang-btn.active {
            background: #54005c;
            border-color: #54005c;
            color: #fff;
        }

        .lang-btn:hover {
            border-color: #fff;
        }
    </style>
</head>
<body>

        <p class="bio" id="bio-text">

    <script>
    (function() {
        const translations = {
            ru: {
                bio: 'Выбирай удобный способ связи. Буду ждать <svg class="icon" viewBox="0 0 24 24" width="1.2em" height="1.2em" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm5.5-3c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5.67-1.5 1.5-1.5 1.5.67 1.5 1.5z"/></svg>',
                tg:   "Написать в Telegram",
                email: "Написать на почту",
                vk:   "Написать ВКонтакте",
                phone: "Позвонить"
            },
            en: {
                bio: 'Choose a convenient way to contact me. Looking forward <svg class="icon" viewBox="0 0 24 24" width="1.2em" height="1.2em" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm5.5-3c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5.67-1.5 1.5-1.5 1.5.67 1.5 1.5z"/></svg>',
                tg:   "Write in Telegram",
                email: "Write an email",
                vk:   "Write in VK",
                phone: "Call"
            }
        };

        const htmlRoot = document.getElementById('html-root');
        const container = document.getElementById('main-container');
        const bioEl = document.getElementById('bio-text');
        const langButtons = document.querySelectorAll('.lang-btn');
        const translatableLinks = document.querySelectorAll('[data-i18n]');

        function getLang() {
            const stored = localStorage.getItem('lang');
            if (stored && (stored === 'ru' || stored === 'en')) {
                return stored;
            }
            const browserLang = navigator.language.slice(0, 2);
            if (browserLang === 'ru') return 'ru';
            return 'ru';
        }

        function applyLanguage(lang) {
            htmlRoot.setAttribute('lang', lang);
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            const t = translations[lang];
            if (bioEl) bioEl.innerHTML = t.bio;
            translatableLinks.forEach(link => {
                const key = link.dataset.i18n;
                if (t[key]) {
                    const span = link.querySelector('.btn-text');
                    if (span) span.textContent = t[key];
                }
            });
            localStorage.setItem('lang', lang);
        }

        const currentLang = getLang();
        applyLanguage(currentLang);

        langButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const lang = this.dataset.lang;
                if (lang !== htmlRoot.getAttribute('lang')) {
                    applyLanguage(lang);
                }
            });
        });

        window.addEventListener('load', function() {
            setTimeout(function() {
                container.classList.add('loaded');
            }, 50);
        });
    })();
    </script>
