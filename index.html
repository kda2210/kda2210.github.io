    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #18001a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #54005c;
        }

        .bio {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #54005c;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 40px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 500;
            border: 1px solid #54005c;
            transition: background 0.3s, transform 0.2s;
        }

        .link-btn i {
            font-size: 1.2em;
        }

        .link-btn:hover {
            background: #6b007a;
            transform: scale(1.02);
        }

        .link-btn.tg {
            animation: heartPulse 1.5s infinite;
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .divider {
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 10px;
        }

        .divider span {
            font-size: 20px;
        }
    </style>
</head>

    <div class="container">

            <i class="fa-brands fa-vk"></i> Написать ВКонтакте
