<!DOCTYPE html>
<html lang="ru" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важно, что внутри.</title>
    <meta name="description" content="Мои контакты: Telegram, почта, ВКонтакте, телефон. Выбирайте удобный способ связи.">
    <meta name="keywords" content="контакты, Telegram, VK, почта, телефон, Kda2210, связь">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://kda2210.github.io/">
    <link rel="alternate" hreflang="ru" href="https://kda2210.github.io/">
    <link rel="alternate" hreflang="en" href="https://kda2210.github.io/">
    <link rel="alternate" hreflang="x-default" href="https://kda2210.github.io/">

    <!-- Предварительное подключение к источнику аватара -->
    <link rel="preconnect" href="https://avatars.githubusercontent.com">
    
    <link rel="icon" href="https://avatars.githubusercontent.com/u/193797799">
    <link rel="apple-touch-icon" sizes="300x300" href="https://avatars.githubusercontent.com/u/193797799">
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/193797799">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kda2210">
    <meta property="og:description" content="Свяжитесь со мной удобным способом">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #18001a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Плавное появление */
        .avatar, .bio, .link-btn, .divider {
            opacity: 0;
            transform: translateY(20px);
        }

        @media (prefers-reduced-motion: no-preference) {
            .avatar, .bio, .link-btn, .divider {
                transition: opacity 0.6s ease, transform 0.6s ease;
            }
        }

        .loaded .avatar,
        .loaded .bio,
        .loaded .link-btn,
        .loaded .divider {
            opacity: 1;
            transform: translateY(0);
        }

        .loaded .avatar           { transition-delay: 0.1s; }
        .loaded .bio              { transition-delay: 0.2s; }
        .loaded .link-btn:nth-of-type(1) { transition-delay: 0.3s; }
        .loaded .link-btn:nth-of-type(2) { transition-delay: 0.35s; }
        .loaded .link-btn:nth-of-type(3) { transition-delay: 0.4s; }
        .loaded .divider          { transition-delay: 0.5s; }
        .loaded .link-btn:nth-of-type(4) { transition-delay: 0.55s; }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #54005c;
        }

        .bio {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
            color: #ffffff;
            text-align: center;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #54005c;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 40px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 500;
            border: 1px solid #54005c;
            transition: background 0.3s, transform 0.2s;
        }

        .link-btn:hover {
            background: #6b007a;
            transform: scale(1.02);
        }

        /* Пульсация Telegram – 3 повтора, только если разрешено движение */
        @media (prefers-reduced-motion: no-preference) {
            .link-btn.tg {
                animation: heartPulse 1.5s 3 forwards;
            }
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .divider {
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 10px;
        }

        .divider span {
            font-size: 20px;
        }

        .lang-switch {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .lang-btn.active {
            background: #54005c;
            border-color: #54005c;
            color: #fff;
        }

        .lang-btn:hover {
            border-color: #fff;
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/193797799" 
             alt="Аватар" loading="lazy">

        <p class="bio" id="bio-text">Выбирай удобный способ связи. Буду ждать.</p>

        <a href="https://t.me/k_d_a_1_3_7" class="link-btn tg" target="_blank" rel="noopener" data-i18n="tg">
            <span class="btn-text">Написать в Telegram</span>
        </a>
        <a href="mailto:knyazev.fx@gmail.com" class="link-btn" data-i18n="email">
            <span class="btn-text">Написать на почту</span>
        </a>
        <a href="https://vk.com/k_d_a_1_3_7" class="link-btn" target="_blank" rel="noopener" data-i18n="vk">
            <span class="btn-text">Написать ВКонтакте</span>
        </a>

        <div class="divider">
            <span>⌄</span>
        </div>

        <a href="tel:+79199330482" class="link-btn" data-i18n="phone">
            <span class="btn-text">Позвонить</span>
        </a>

        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru" type="button">🇷🇺 RU</button>
            <button class="lang-btn" data-lang="en" type="button">🇬🇧 EN</button>
        </div>
    </div>

    <script>
    (function() {
        const translations = {
            ru: {
                bio: 'Выбирай удобный способ связи. Буду ждать.',
                tg:   "Написать в Telegram",
                email: "Написать на почту",
                vk:   "Написать ВКонтакте",
                phone: "Позвонить"
            },
            en: {
                bio: 'Choose a convenient way to contact me. Looking forward.',
                tg:   "Write in Telegram",
                email: "Write an email",
                vk:   "Write in VK",
                phone: "Call"
            }
        };

        const htmlRoot = document.getElementById('html-root');
        const container = document.getElementById('main-container');
        const bioEl = document.getElementById('bio-text');
        const langButtons = document.querySelectorAll('.lang-btn');
        const translatableLinks = document.querySelectorAll('[data-i18n]');

        function getLang() {
            const stored = localStorage.getItem('lang');
            if (stored && (stored === 'ru' || stored === 'en')) {
                return stored;
            }
            const browserLang = navigator.language.slice(0, 2);
            if (browserLang === 'ru') return 'ru';
            return 'ru';
        }

        function applyLanguage(lang) {
            htmlRoot.setAttribute('lang', lang);
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            const t = translations[lang];
            if (bioEl) bioEl.textContent = t.bio;
            translatableLinks.forEach(link => {
                const key = link.dataset.i18n;
                if (t[key]) {
                    const span = link.querySelector('.btn-text');
                    if (span) span.textContent = t[key];
                }
            });
            localStorage.setItem('lang', lang);
        }

        const currentLang = getLang();
        applyLanguage(currentLang);

        langButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const lang = this.dataset.lang;
                if (lang !== htmlRoot.getAttribute('lang')) {
                    applyLanguage(lang);
                }
            });
        });

        window.addEventListener('load', function() {
            setTimeout(function() {
                container.classList.add('loaded');
            }, 50);
        });
    })();
    </script>
</body>
</html>
